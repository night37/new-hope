nelmio_cors:
  defaults:
    allow_origin: ["http://localhost:4200"] # URL de développement Angular
    allow_methods: ["GET", "OPTIONS", "POST", "PUT", "DELETE"]
    allow_headers: ["Content-Type", "Authorization"]
    max_age: 3600
  paths:
    "^/api/": # Active CORS uniquement pour les routes commençant par /api
      allow_origin: ["http://localhost:4200", "http://localhost:3000","*"]
