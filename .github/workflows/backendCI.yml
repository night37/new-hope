name: backendCI
on:
  push:
    branches: [ preprod ]
  pull_request:
    branches: [ preprod ]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back  # ← Définit le répertoire par défaut
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
    - name: Create temporary .env for build
      run: |
        echo "APP_ENV=prod" > .env
        echo "APP_SECRET=temp-build-secret" >> .env
        echo "DATABASE_URL=mysql://temp:temp@localhost/temp" >> .env
        
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: .back/vendor
        key: ${{ runner.os }}-php-${{ hashFiles('back/composer.lock') }}
        
    - name: Install Dependencies
      run: composer install      
    - name: Create schema
    - name: Deploy and clear cache on server
      run: |
        rsync -avz --delete --exclude='.env' ./ user@server:/path/
        ssh user@server "cd /path && php bin/console cache:clear"

